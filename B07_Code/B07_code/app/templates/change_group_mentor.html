{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/organization.css') }}">
{% endblock %}

{% block content %}
<div class="org-form-page">
    <section class="org-hero">
        <p class="org-eyebrow">Group Management</p>
        <h2>Change Group Mentor</h2>
        <p>Assign a new mentor to an existing MCP group.</p>
    </section>

    <section class="org-card">
        <form class="org-form" method="post">
            <div class="org-form-grid">
                <div class="org-form-group is-full">
                    <label>MCP Group</label>
                    <select name="group_id" required>
                        {% for group in groups %}
                            <option value="{{ group.id }}">
                                {{ group.group_id }} - Current Mentor: {{ group.mentor.name if group.mentor else "N/A" }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="org-form-group is-full">
                    <label>New Mentor</label>
                    <select name="mentor_id" required>
                        {% for mentor in mentors %}
                            <option value="{{ mentor.id }}">
                                {{ mentor.name }} - {{ mentor.email }} - {{ mentor.office }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <div class="org-form-actions">
                <button type="submit">Change Mentor</button>
                <a class="org-secondary-action" href="{{ url_for('consultant.faculty_groups') }}">← Back to Group List</a>
                <a class="org-secondary-action" href="{{ url_for('consultant.faculty_home') }}">Back to Home</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
