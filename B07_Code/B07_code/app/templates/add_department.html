{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/pages/organization.css') }}">
{% endblock %}

{% block content %}
<div class="org-form-page">
    <section class="org-hero">
        <p class="org-eyebrow">Organization Setup</p>
        <h2>Add Department</h2>
        <p>Add a department under an existing faculty.</p>
    </section>

    <section class="org-card">
        <form class="org-form" method="post">
            <div class="org-form-grid">
                <div class="org-form-group">
                    <label>Faculty</label>
                    <select name="faculty_id" required>
                        {% for faculty in faculties %}
                            <option value="{{ faculty.id }}">{{ faculty.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="org-form-group">
                    <label>Department Name</label>
                    <input type="text" name="name" required placeholder="Enter department name">
                </div>
            </div>

            <div class="org-form-actions">
                <button type="submit">Add Department</button>
                <a class="org-secondary-action" href="{{ url_for('admin.organization') }}">← Back to Organization Structure</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
